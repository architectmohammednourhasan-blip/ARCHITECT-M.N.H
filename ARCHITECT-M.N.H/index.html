<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>ARCHITECT M.N.H</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Cairo','Poppins','Segoe UI',sans-serif;
      background:url('background.jpg') no-repeat center center fixed;
      background-size:cover;
      color:#fff;
      text-align:center;
      background-attachment: fixed;
      opacity:0;
      transition: opacity 1.5s ease-in-out;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    body.loaded{
      opacity:1;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding:10px 40px;
    }
    .logo{
      width:150px;
      margin-right:20px;
      margin-top:10px;
      filter:drop-shadow(0 0 10px rgba(255,255,255,0.8));
      transition:transform 0.3s, box-shadow 0.3s;
      opacity:0;
      transform:translateY(-30px);
      animation:fadeDown 1s forwards 0.2s;
    }
    .logo:hover{
      transform:scale(1.1) translateY(-5px);
      box-shadow:0 20px 30px rgba(0,0,0,0.7);
    }

    .name-container{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    h1, h2, h3, h4{
      opacity:0;
      transform:translateY(30px);
      animation:fadeUp 1s forwards;
      transition: all 0.3s ease;
      cursor:pointer;
      color:#fff;
      margin:5px 0;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
    }
    h1{animation-delay:0.6s; font-size:38px; font-weight:700;}
    h2{animation-delay:0.9s; font-size:38px; font-weight:700;}
    h3{animation-delay:1.2s; font-size:22px; font-weight:400;}
    h4{animation-delay:1.4s; font-size:18px; font-weight:400;}

    h1:hover, h2:hover, h3:hover, h4:hover{
      transform:translateY(-5px) scale(1.02);
      text-shadow:2px 2px 8px rgba(0,0,0,0.9);
    }

    @keyframes fadeUp {
      to {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeDown {
      to {opacity:1; transform:translateY(0);}
    }

    .contact{
      margin:20px auto 40px auto;
      display:flex;
      justify-content:center; /* يضمن تمركز QR */
    }
    .contact img{
      width:150px;
      transition: transform 0.3s, filter 0.5s, opacity 0.5s;
      opacity:0.9;
      filter:drop-shadow(0 0 10px rgba(0,0,0,0.5));
    }
    .contact img:hover{
      transform:scale(1.15) rotate(3deg);
      filter:drop-shadow(0 0 25px rgba(255,255,255,0.9));
      opacity:1;
    }

    .portfolio{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }
    .portfolio-item{
      position:relative;
      overflow:hidden;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.6);
      opacity:0;
      transform:translateY(50px);
      transition:all 0.6s ease-out;
    }
    .portfolio-item.show{
      opacity:1;
      transform:translateY(0);
    }
    .portfolio-item img{
      width:100%;
      display:block;
      transition:transform 0.3s;
    }
    .portfolio-item:hover img{
      transform:scale(1.1);
    }
    .portfolio-item:hover{
      box-shadow:0 15px 30px rgba(0,0,0,0.7);
      transform:translateY(-5px);
    }
    .portfolio-overlay{
      position:absolute;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(0,0,0,0.7);
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      opacity:1;
      font-size:20px;
      font-weight:600;
      letter-spacing:1px;
      transition:all 0.4s ease;
      padding-bottom:20px;
    }
    .portfolio-item:hover .portfolio-overlay{
      align-items:center;
      background:rgba(0,0,0,0.5);
      font-size:22px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="شعار" class="logo">
  </header>

  <div class="name-container">
    <h1>المهندس المعماري محمد نور حسن</h1>
    <h2>Architect Mohammed Nour Hasan</h2>
    <h3>Architectural Portfolio</h3>
    <h4>سوريا - حلب</h4>
  </div>

  <div class="contact">
    <img src="qr.png" alt="QR للتواصل">
  </div>

  <section class="portfolio" id="portfolio">
    <div class="portfolio-item">
      <img src="projects/project1.jpg" alt="مشروع 1">
      <div class="portfolio-overlay">مشروع 1</div>
    </div>
    <div class="portfolio-item">
      <img src="projects/project2.jpg" alt="مشروع 2">
      <div class="portfolio-overlay">مشروع 2</div>
    </div>
    <div class="portfolio-item">
      <img src="projects/project3.jpg" alt="مشروع 3">
      <div class="portfolio-overlay">مشروع 3</div>
    </div>
  </section>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });

    const items = document.querySelectorAll('.portfolio-item');
    function showItems() {
      const triggerBottom = window.innerHeight * 0.85;
      items.forEach(item => {
        const itemTop = item.getBoundingClientRect().top;
        if(itemTop < triggerBottom){
          item.classList.add('show');
        }
      });
    }
    window.addEventListener('scroll', showItems);
    window.addEventListener('load', showItems);
  </script>

</body>
</html>
